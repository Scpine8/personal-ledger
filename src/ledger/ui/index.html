<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Ledger</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4ddd0;
      --paper: #f6f3ec;
      --card: #fffdf8;
      --green: #1d6b45;
      --green-ink: #f4fff8;
      --out: #8d3b2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    h1 { font-family: Palatino, "Iowan Old Style", Georgia, serif; font-weight: 600; margin: 0; font-size: 2rem; }
    .eyebrow { margin: 0 0 4px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; color: var(--muted); }
    .badge {
      margin: 0;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 0.85rem;
    }
    form, table {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input {
      min-width: 220px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      background: var(--green);
      color: var(--green-ink);
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.4em; color: var(--muted); }
    #status.bad { color: var(--out); }
    .toolbar { margin: 18px 0 8px; }
    #hint { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; max-width: 62ch; }
    .accounts { overflow: visible; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    td.num, th.num { text-align: right; }
    th .sort {
      background: transparent;
      color: inherit;
      border: 0;
      padding: 0;
      font: inherit;
      font-weight: 600;
      font-size: inherit;
      cursor: pointer;
    }
    th[aria-sort="ascending"] .sort::after { content: " \2191"; }
    th[aria-sort="descending"] .sort::after { content: " \2193"; }
    td.action, th.action { width: 1%; white-space: nowrap; text-align: right; }
    .table-tools { display: flex; justify-content: flex-end; margin: 0 0 8px; }
    .bad { color: var(--out); }
    .health { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .empty { color: var(--muted); }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--line);
      border-top-color: var(--ink);
      border-radius: 50%;
      vertical-align: middle;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .menu { position: relative; display: inline-block; }
    .menu-list {
      position: fixed;
      z-index: 4;
      min-width: 9rem;
      padding: 6px;
      display: grid;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .menu-list button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
    }
    .menu-list[hidden] { display: none; }
    .menu-list button:hover { background: var(--paper); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(28, 25, 21, 0.35);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(420px, calc(100% - 32px));
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .modal h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .modal p { margin: 0 0 16px; color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 720px) {
      header { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Personal Ledger</p>
        <h1>Accounts</h1>
      </div>
      <p id="provider" class="badge">Checking server…</p>
    </header>

    <form id="key-form">
      <div>
        <label for="api-key">API key</label>
        <input id="api-key" name="api-key" type="password" autocomplete="off" required>
      </div>
      <button type="submit">Save key</button>
    </form>
    <p id="status" role="status"></p>

    <div class="toolbar">
      <button id="connect" type="button">Connect institution</button>
      <p id="hint"></p>
    </div>

    <div id="accounts" class="accounts"></div>
  </main>
  <div id="confirm-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="secondary" type="button">Cancel</button>
        <button id="confirm-ok" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    const keyForm = document.querySelector("#key-form");
    const keyInput = document.querySelector("#api-key");
    const statusEl = document.querySelector("#status");
    const providerEl = document.querySelector("#provider");
    const hintEl = document.querySelector("#hint");
    const connectBtn = document.querySelector("#connect");
    const accountsEl = document.querySelector("#accounts");
    const confirmModal = document.querySelector("#confirm-modal");
    const confirmTitle = document.querySelector("#confirm-title");
    const confirmBody = document.querySelector("#confirm-body");
    const confirmOk = document.querySelector("#confirm-ok");
    const confirmCancel = document.querySelector("#confirm-cancel");

    const KEY = "ledger.apiKey";
    const USER = "ledger.clientUserId";
    let providerName = "unknown";
    let accounts = [];
    let sortKey = null;
    let sortDir = 1;

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle("bad", Boolean(isError));
    }

    function rowLoader() {
      const loader = document.createElement("span");
      loader.className = "loader";
      loader.setAttribute("role", "status");
      loader.setAttribute("aria-label", "Working");
      return loader;
    }

    async function withRowLoader(cell, account, work) {
      cell.replaceChildren(rowLoader());
      try {
        await work();
      } catch (err) {
        setStatus(err && err.message ? err.message : "Request failed", true);
        if (cell.isConnected) cell.replaceChildren(actionMenu(account, cell));
      }
    }

    function money(value, currency) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: currency || "USD",
      }).format(Number(value || 0));
    }

    function typeLabel(account) {
      return account.subtype || account.type || "";
    }

    function balanceValue(account) {
      const value = Number(account.current_balance);
      return Number.isFinite(value) ? value : 0;
    }

    function syncedValue(account) {
      const value = Date.parse(account.last_synced_at || "");
      return Number.isFinite(value) ? value : 0;
    }

    function when(value) {
      if (!value) return "Not synced";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function clientUserId() {
      let id = sessionStorage.getItem(USER);
      if (!id) {
        id = "ledger-" + crypto.randomUUID();
        sessionStorage.setItem(USER, id);
      }
      return id;
    }

    function empty(parent, message) {
      parent.replaceChildren();
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = message;
      parent.appendChild(p);
    }

    async function api(path, options) {
      const headers = new Headers(options && options.headers);
      headers.set("X-API-Key", sessionStorage.getItem(KEY) || "");
      if (options && options.body) headers.set("Content-Type", "application/json");
      const response = await fetch(path, { method: options && options.method, body: options && options.body, headers });
      const text = await response.text();
      let body = null;
      if (text) {
        try {
          body = JSON.parse(text);
        } catch (_err) {
          body = { detail: text };
        }
      }
      if (!response.ok) {
        const detail = body && body.detail ? body.detail : response.statusText;
        throw new Error(typeof detail === "string" ? detail : "Request failed");
      }
      return body;
    }

    function sortedAccounts() {
      const rows = accounts.slice();
      if (!sortKey) return rows;
      rows.sort((a, b) => {
        if (sortKey === "type") {
          return typeLabel(a).localeCompare(typeLabel(b)) * sortDir;
        }
        if (sortKey === "synced") {
          return (syncedValue(a) - syncedValue(b)) * sortDir;
        }
        return (balanceValue(a) - balanceValue(b)) * sortDir;
      });
      return rows;
    }

    function sortHeader(label, key, numeric) {
      const cell = document.createElement("th");
      if (numeric) cell.className = "num";
      cell.setAttribute("aria-sort", sortKey === key ? (sortDir > 0 ? "ascending" : "descending") : "none");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "sort";
      button.textContent = label;
      button.addEventListener("click", () => {
        if (sortKey === key) sortDir *= -1;
        else {
          sortKey = key;
          sortDir = key === "type" ? 1 : -1;
        }
        renderAccounts();
      });
      cell.appendChild(button);
      return cell;
    }

    function renderAccounts() {
      if (!accounts.length) {
        empty(accountsEl, "No accounts yet.");
        return;
      }
      const table = document.createElement("table");
      const head = document.createElement("tr");
      const nameHeader = document.createElement("th");
      nameHeader.textContent = "Name";
      const connectionHeader = document.createElement("th");
      connectionHeader.textContent = "Connection";
      const actionHeader = document.createElement("th");
      actionHeader.className = "action";
      actionHeader.textContent = "Actions";
      head.append(
        nameHeader,
        sortHeader("Type", "type", false),
        sortHeader("Balance", "balance", true),
        sortHeader("Last synced", "synced", false),
        connectionHeader,
        actionHeader,
      );
      const thead = document.createElement("thead");
      thead.appendChild(head);
      const tbody = document.createElement("tbody");
      for (const account of sortedAccounts()) {
        const row = document.createElement("tr");
        const name = document.createElement("td");
        name.textContent = account.name;
        const type = document.createElement("td");
        type.textContent = typeLabel(account);
        const balance = document.createElement("td");
        balance.className = "num";
        balance.textContent = money(account.current_balance, account.iso_currency_code);
        const synced = document.createElement("td");
        synced.textContent = when(account.last_synced_at);
        const connection = document.createElement("td");
        const health = document.createElement("div");
        health.className = "health";
        const closed = account.status === "closed";
        const label = document.createElement("span");
        label.textContent = closed ? "Closed" : (account.connection_label || "Connected");
        if (!closed && account.connection_action && account.connection_action !== "none") {
          label.className = "bad";
        }
        if (account.connection_detail) health.title = account.connection_detail;
        health.appendChild(label);
        if (!closed && (account.connection_action === "update" || account.connection_action === "connect")) {
          const repair = document.createElement("button");
          repair.type = "button";
          repair.className = "secondary";
          repair.textContent = account.connection_action === "connect" ? "Connect again" : "Reconnect";
          repair.addEventListener("click", () => reconnect(account, repair));
          health.appendChild(repair);
        }
        connection.appendChild(health);
        const action = document.createElement("td");
        action.className = "action";
        action.appendChild(actionMenu(account, action));
        row.append(name, type, balance, synced, connection, action);
        tbody.appendChild(row);
      }
      table.append(thead, tbody);
      const tools = document.createElement("div");
      tools.className = "table-tools";
      const syncAll = document.createElement("button");
      syncAll.type = "button";
      syncAll.className = "secondary";
      syncAll.textContent = "Sync all";
      syncAll.addEventListener("click", () => syncAllItems(syncAll));
      tools.appendChild(syncAll);
      accountsEl.replaceChildren(tools, table);
    }

    function actionMenu(account, cell) {
      const closed = account.status === "closed";
      const menu = document.createElement("div");
      menu.className = "menu";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "secondary";
      toggle.textContent = "Actions";
      const list = document.createElement("div");
      list.className = "menu-list";
      list.hidden = true;
      function item(label, disabled, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.disabled = disabled;
        button.addEventListener("click", () => {
          list.hidden = true;
          onClick();
        });
        list.appendChild(button);
      }
      item("Sync", closed, () => syncItem(account, cell));
      item("Close", closed, () => closeAccount(account, cell));
      item("Delete", false, () => deleteAccount(account, cell));
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const willOpen = list.hidden;
        document.querySelectorAll(".menu-list").forEach((open) => { open.hidden = true; });
        if (!willOpen) return;
        list.hidden = false;
        const rect = toggle.getBoundingClientRect();
        const height = list.offsetHeight;
        const width = list.offsetWidth;
        let top = rect.bottom + 4;
        if (top + height > window.innerHeight - 8 && rect.top > height + 8) {
          top = rect.top - height - 4;
        }
        let left = rect.right - width;
        left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
        list.style.top = top + "px";
        list.style.left = left + "px";
      });
      list.addEventListener("click", (event) => event.stopPropagation());
      menu.append(toggle, list);
      return menu;
    }

    function askConfirm(title, body) {
      return new Promise((resolve) => {
        confirmTitle.textContent = title;
        confirmBody.textContent = body;
        confirmModal.hidden = false;
        function finish(accepted) {
          confirmModal.hidden = true;
          confirmOk.removeEventListener("click", onOk);
          confirmCancel.removeEventListener("click", onCancel);
          resolve(accepted);
        }
        function onOk() { finish(true); }
        function onCancel() { finish(false); }
        confirmOk.addEventListener("click", onOk);
        confirmCancel.addEventListener("click", onCancel);
      });
    }

    async function closeAccount(account, cell) {
      const accepted = await askConfirm(
        "Close " + account.name + "?",
        "The account stays in the ledger. New activity will not be fetched, and its balance will leave net worth."
      );
      if (!accepted) return;
      await withRowLoader(cell, account, async () => {
        await api("/v1/accounts/" + encodeURIComponent(account.id) + "/close", { method: "POST" });
        setStatus(account.name + " closed.");
        await refresh();
      });
    }

    async function deleteAccount(account, cell) {
      const accepted = await askConfirm(
        "Delete " + account.name + "?",
        "This removes the account and its transactions, balances, and holdings. This cannot be undone."
      );
      if (!accepted) return;
      await withRowLoader(cell, account, async () => {
        await api("/v1/accounts/" + encodeURIComponent(account.id), { method: "DELETE" });
        setStatus(account.name + " deleted.");
        await refresh();
      });
    }

    async function refresh() {
      try {
        await api("/v1/items/health", { method: "POST" });
      } catch (_err) {
        // The account list still shows the last connection state we saved.
      }
      accounts = await api("/v1/accounts");
      renderAccounts();
    }

    async function syncAllItems(button) {
      const ids = [];
      for (const account of accounts) {
        if (account.status === "closed") continue;
        if (!ids.includes(account.item_id)) ids.push(account.item_id);
      }
      if (!ids.length) {
        setStatus("No open accounts to sync.");
        return;
      }
      button.disabled = true;
      setStatus("Syncing " + ids.length + (ids.length === 1 ? " institution…" : " institutions…"));
      try {
        for (const id of ids) {
          await api("/v1/items/" + encodeURIComponent(id) + "/sync", { method: "POST" });
        }
        setStatus("All accounts synced.");
        await refresh();
      } catch (err) {
        setStatus(err.message, true);
        button.disabled = false;
      }
    }

    async function reconnect(account, button) {
      if (account.connection_action === "connect") {
        await connect();
        return;
      }
      button.disabled = true;
      try {
        if (providerName === "mock") {
          await api("/v1/items/" + encodeURIComponent(account.item_id) + "/sync", { method: "POST" });
          setStatus(account.name + " reconnected.");
          await refresh();
          return;
        }
        if (!window.Plaid) {
          throw new Error("Plaid Link did not load. Check the network and reload the page.");
        }
        setStatus("Opening Plaid to reconnect " + account.name + "…");
        const token = await api("/v1/items/" + encodeURIComponent(account.item_id) + "/link-token", {
          method: "POST",
          body: JSON.stringify({ client_user_id: clientUserId() }),
        });
        const publicToken = await openLink(token.link_token);
        if (!publicToken) {
          setStatus("Reconnect closed before the login was repaired.");
          button.disabled = false;
          return;
        }
        setStatus("Checking the repaired connection…");
        await api("/v1/items/" + encodeURIComponent(account.item_id) + "/sync", { method: "POST" });
        setStatus(account.name + " reconnected.");
        await refresh();
      } catch (err) {
        setStatus(err.message, true);
        button.disabled = false;
      }
    }

    async function syncItem(account, cell) {
      await withRowLoader(cell, account, async () => {
        await api("/v1/items/" + encodeURIComponent(account.item_id) + "/sync", { method: "POST" });
        setStatus(account.name + " synced.");
        await refresh();
      });
    }

    function openLink(linkToken) {
      return new Promise((resolve, reject) => {
        let finished = false;
        const handler = Plaid.create({
          token: linkToken,
          onSuccess(publicToken) {
            finished = true;
            resolve(publicToken);
          },
          onExit(err) {
            if (finished) return;
            if (err) {
              reject(new Error(err.display_message || err.error_message || "Plaid Link failed"));
              return;
            }
            resolve(null);
          },
        });
        handler.open();
      });
    }

    async function connect() {
      if (!sessionStorage.getItem(KEY)) {
        setStatus("Save the API key from your .env file first.");
        keyInput.focus();
        return;
      }
      connectBtn.disabled = true;
      try {
        if (providerName === "mock") {
          setStatus("Connecting the sample institution…");
          await api("/v1/items", { method: "POST", body: "{}" });
          setStatus("Sample institution connected.");
          await refresh();
          return;
        }
        if (!window.Plaid) {
          throw new Error("Plaid Link did not load. Check the network and reload the page.");
        }
        setStatus("Opening Plaid Link…");
        const token = await api("/v1/link/token", {
          method: "POST",
          body: JSON.stringify({ client_user_id: clientUserId() }),
        });
        const publicToken = await openLink(token.link_token);
        if (!publicToken) {
          setStatus("Link closed before a connection was made.");
          return;
        }
        setStatus("Exchanging the connection and syncing…");
        const result = await api("/v1/items", {
          method: "POST",
          body: JSON.stringify({ public_token: publicToken }),
        });
        const name = result.item.institution_name || "Institution";
        setStatus(name + " connected.");
        await refresh();
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        connectBtn.disabled = false;
      }
    }

    keyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      sessionStorage.setItem(KEY, keyInput.value.trim());
      setStatus("Loading accounts…");
      try {
        await refresh();
        setStatus("Key saved in this browser tab.");
      } catch (err) {
        setStatus(err.message, true);
      }
    });
    connectBtn.addEventListener("click", connect);
    document.addEventListener("click", () => {
      document.querySelectorAll(".menu-list").forEach((menu) => { menu.hidden = true; });
    });
    window.addEventListener("resize", () => {
      document.querySelectorAll(".menu-list").forEach((menu) => { menu.hidden = true; });
    });
    window.addEventListener("scroll", () => {
      document.querySelectorAll(".menu-list").forEach((menu) => { menu.hidden = true; });
    }, true);

    const saved = sessionStorage.getItem(KEY);
    if (saved) keyInput.value = saved;

    fetch("/health")
      .then((response) => response.json())
      .then((health) => {
        providerName = health.provider || "unknown";
        providerEl.textContent = providerName === "plaid" ? "Plaid" : "Sample data";
        hintEl.textContent = providerName === "plaid"
          ? "In Link, continue without a phone number, then search First Platypus Bank. Username user_good, password pass_good. Code, if asked: 1234."
          : "Plaid keys are empty, so Connect attaches the built-in sample institution.";
        if (saved) {
          return refresh().then(() => setStatus(""));
        }
        setStatus("Save the API key from your .env file, then connect an institution.");
      })
      .catch(() => {
        providerEl.textContent = "Offline";
        setStatus("The ledger server did not respond.");
      });
  </script>
</body>
</html>
